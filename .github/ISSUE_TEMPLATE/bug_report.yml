name: Bug report
description: Report a reproducible problem in ADB Commander
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Remove personal paths, filenames and device serials.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Select…
        3. Click…
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android device and version

  - type: input
    id: adb
    attributes:
      label: ADB version

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
